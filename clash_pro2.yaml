mixed-port: 7890
allow-lan: false
bind-address: '*'
mode: rule
log-level: info
external-controller: 127.0.0.1:9090
unified-delay: true
tcp-concurrent: true
ipv6: false
dns:
  enable: true
  ipv6: false
  follow-rule: false
  respect-rules: true
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  use-hosts: true
  default-nameserver:
  - 223.5.5.5
  - 119.29.29.29
  proxy-server-nameserver:
  - https://dns.alidns.com/dns-query
  - https://doh.pub/dns-query
  nameserver:
  - 223.5.5.5
  - 119.29.29.29
  fallback:
  - https://cloudflare-dns.com/dns-query
  - https://dns.cloudflare.com/dns-query
  - https://dns.alidns.com/dns-query
  - https://doh.pub/dns-query
  fallback-filter:
    geoip: true
    geoip-code: CN
    geosite:
    - gfw
proxies:
- name: 🏆 Pro自建·节点5
  type: vless
  server: vless.gem-audio2.us.ci
  port: 443
  uuid: f14f0e7d-bcb0-416b-855a-17344b0242b9
  tls: true
  servername: vless.gem-audio2.us.ci
  network: ws
  ip-version: ipv4
  ws-opts:
    path: /
    headers:
      Host: vless.gem-audio2.us.ci
proxy-groups:
- name: 🚀 节点选择
  type: select
  proxies:
  - 🏆 Pro自建·节点5
  - ♻️ 自动选择
- name: ♻️ 自动选择
  type: url-test
  url: http://cp.cloudflare.com/generate_204
  interval: 300
  tolerance: 100
  proxies:
  - 🏆 Pro自建·节点5
- name: 🐟 漏网之鱼
  type: select
  proxies:
  - 🚀 节点选择
  - DIRECT
- name: 🎬 媒体解锁
  type: select
  proxies:
  - 🚀 节点选择
  - DIRECT
- name: 🤖 AI网站
  type: select
  proxies:
  - 🚀 节点选择
  - DIRECT
- name: 🛑 广告拦截
  type: select
  proxies:
  - REJECT
  - DIRECT
rules:
- DOMAIN-SUFFIX,local,DIRECT
- DOMAIN-SUFFIX,localhost,DIRECT
- IP-CIDR,127.0.0.0/8,DIRECT,no-resolve
- IP-CIDR,10.0.0.0/8,DIRECT,no-resolve
- IP-CIDR,172.16.0.0/12,DIRECT,no-resolve
- IP-CIDR,192.168.0.0/16,DIRECT,no-resolve
- GEOIP,CN,DIRECT
- MATCH,🚀 节点选择
